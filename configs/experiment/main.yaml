defaults:
  base: ../base.yaml
  data: ../data/urbansarfloods.yaml
  model: ../model/smallflood_cdnet.yaml
training:
  epochs: 120
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  warmup_epochs: 5
  patience: 15
  gradient_clip_norm: 1.0
loss:
  bce_weight: 0.4
  tversky_weight: 0.4
  boundary_weight: 0.2
  tversky_fp: 0.3
  tversky_fn: 0.7
  component_alpha: 1.0
  component_gamma: 0.5
  component_weight_cap: 4.0
selection:
  version: event_pixel_v2
  metric: event_macro_f1
  mode: max
  probability_threshold: 0.5
