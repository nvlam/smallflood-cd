# Diagnostic 2x2 plan; not authorized for generic run_experiment (it reads test).
defaults:
  base: ../../base.yaml
  data: ../../data/urbansarfloods.yaml
  model: ../../model/smallflood_cdnet.yaml
base:
  seed: 42
  deterministic: true
  device: cuda
  amp: false
  num_workers: 0
model:
  boundary_head: true
training:
  epochs: 15
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 16
  gradient_clip_norm: 1.0
loss:
  bce_weight: 0.4
  tversky_weight: 0.4
  boundary_weight: 0.2
  use_size_aware: true
  tversky_fp: 0.3
  tversky_fn: 0.7
  component_alpha: 1.0
  component_gamma: 0.5
  component_weight_cap: 4.0
selection:
  version: event_pixel_v2
  metric: event_macro_f1
  mode: max
  probability_threshold: 0.5
protocol:
  id: proposed_factorial_v1
  cell: D
  stage: diagnostic_validation_only
  execution_approved: false
  test_allowed: false
  scheduler: none
  shared_initialization: exact_common_state_required

