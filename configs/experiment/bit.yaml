defaults:
  base: ../base.yaml
  data: ../data/urbansarfloods.yaml
  model: ../model/bit.yaml
training:
  epochs: 120
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.0001
  patience: 15
  gradient_clip_norm: 1.0
loss:
  bce_weight: 0.5
  tversky_weight: 0.5
  boundary_weight: 0.0
  tversky_fp: 0.3
  tversky_fn: 0.7
  use_size_aware: false
evaluation:
  probability_threshold: 0.5
  component_match_iou: 0.1
  shift_pixels: 0
  morphology: none
timing:
  warmup_runs: 20
  timed_runs: 100

