# Isolated candidate_r_runner.py only; generic experiment runner is NOT allowed.
defaults:
  base: ../../base.yaml
  data: ../../data/urbansarfloods.yaml
  model: ../../model/smallflood_cdnet.yaml
base:
  seed: 42
  deterministic: true
  device: cuda
  amp: false
  num_workers: 0
model:
  boundary_head: false
training:
  epochs: 15
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 16
  gradient_clip_norm: 1.0
loss:
  bce_weight: 0.4
  tversky_weight: 0.4
  boundary_weight: 0.0
  use_size_aware: false
  tversky_fp: 0.3
  tversky_fn: 0.7
  component_alpha: 1.0
  component_gamma: 0.5
  component_weight_cap: 4.0
selection:
  version: event_pixel_v2
  metric: event_macro_f1
  mode: max
  probability_threshold: 0.5
protocol:
  id: candidate_r_v1
  cell: R
  stage: diagnostic_validation_only
  execution_approved: false
  test_allowed: false
  scheduler: none
  shared_initialization: exact_full_state_required
local_supervision:
  small_area_threshold: 35
  radius: 3
  connectivity: 8
  aggregation: eligible_component_mean_across_minibatch
  coefficient: 0.1
